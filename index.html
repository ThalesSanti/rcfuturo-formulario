<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RC Futuro - Cadastro de Clientes</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<img src="logo.png" class="logo" alt="RC Futuro">

<h1>Cadastro de Clientes</h1>

<p id="textoInstrucao">
O que você deseja?
</p>


<!-- ETAPA 1: SERVIÇO OU PRODUTO -->

<div class="botoes" id="botoesTipo">

<button id="btnServico">
Solicitar um Serviço
</button>

<button id="btnProduto">
Comprar um Produto
</button>

</div>


<!-- ETAPA 2: PESSOA FÍSICA OU JURÍDICA -->

<div id="etapaPessoa" style="display: none;">

<div class="botoes" id="botoesPessoa">

<button id="btnPF">
Pessoa Física
</button>

<button id="btnPJ">
Pessoa Jurídica
</button>

</div>

<button id="btnVoltar" type="button">
← Voltar
</button>

</div>


<!-- FORMULÁRIO -->

<div class="formulario">

<iframe
id="frame"
src=""
frameborder="0"
style="display: none;">
</iframe>

</div>

</div>


<script>

const frame = document.getElementById("frame");

const textoInstrucao = document.getElementById("textoInstrucao");

const botoesTipo = document.getElementById("botoesTipo");

const etapaPessoa = document.getElementById("etapaPessoa");

const botoesPessoa = document.getElementById("botoesPessoa");

const btnServico = document.getElementById("btnServico");

const btnProduto = document.getElementById("btnProduto");

const btnVoltar = document.getElementById("btnVoltar");

const pf = document.getElementById("btnPF");

const pj = document.getElementById("btnPJ");

let tipoSelecionado = "";


// ESCOLHA: SERVIÇO

btnServico.onclick = function(){

tipoSelecionado = "servico";

textoInstrucao.innerText = "Selecione o tipo de cadastro.";

botoesTipo.style.display = "none";

etapaPessoa.style.display = "block";

frame.style.display = "none";

frame.src = "";

}


// ESCOLHA: PRODUTO

btnProduto.onclick = function(){

tipoSelecionado = "produto";

textoInstrucao.innerText = "Selecione o tipo de cadastro.";

botoesTipo.style.display = "none";

etapaPessoa.style.display = "block";

frame.style.display = "none";

frame.src = "";

}


// VOLTAR PARA SERVIÇO OU PRODUTO

btnVoltar.onclick = function(){

tipoSelecionado = "";

textoInstrucao.innerText = "O que você deseja?";

botoesTipo.style.display = "flex";

etapaPessoa.style.display = "none";

frame.style.display = "none";

frame.src = "";

pf.classList.remove("ativo");

pj.classList.remove("ativo");

}


// PESSOA FÍSICA

pf.onclick = function(){

frame.style.display = "block";

if(tipoSelecionado === "servico"){

frame.src = "pf.html";

} else if(tipoSelecionado === "produto"){

frame.src = "pf-vendas.html";

}

pf.classList.add("ativo");

pj.classList.remove("ativo");

}


// PESSOA JURÍDICA

pj.onclick = function(){

frame.style.display = "block";

if(tipoSelecionado === "servico"){

frame.src = "pj.html";

} else if(tipoSelecionado === "produto"){

frame.src = "pj-vendas.html";

}

pj.classList.add("ativo");

pf.classList.remove("ativo");

}

</script>

</body>

</html>
